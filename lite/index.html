<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spaday-trees in Pyodide</title>
    <link rel="stylesheet" href="./components/trees/css/index.css" />
    <style>
      #pyodide-status {
        position: sticky;
        z-index: 10000;
        top: 0;
        box-sizing: border-box;
        min-height: 3rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #cbd5e1;
        color: #475569;
        background: #fffffff2;
        font:
          14px/1.4 system-ui,
          sans-serif;
        backdrop-filter: blur(12px);
      }
      #pyodide-error {
        margin: 1rem;
        color: #b91c1c;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="pyodide-status">Loading Python in the browser…</div>
    <div id="example-root"></div>
    <pre id="pyodide-error" hidden></pre>
    <script type="module">
      import {
        connectStore,
        init,
        mount,
        Store,
      } from "./runtime/spaday/cdn/index.js";
      import "./components/trees/cdn/index.js";
      import * as transports from "./runtime/spaday/transports/cdn/index.js";

      const status = document.querySelector("#pyodide-status");
      const pendingEndpoints = new Map();
      let nextEndpointId = 0;
      let receiveWires = () => {};

      function fail(error) {
        status.textContent = "Unable to start";
        const output = document.querySelector("#pyodide-error");
        output.hidden = false;
        output.textContent = String(error);
      }

      try {
        await Promise.all([
          init({ module_or_path: "./runtime/spaday/pkg/spaday_bg.wasm" }),
          transports.wasm.default({
            module_or_path:
              "./runtime/spaday/transports/pkg/transports_bg.wasm",
          }),
        ]);

        const worker = new Worker("./pyodide-worker.js", { type: "module" });
        const nativeFetch = globalThis.fetch.bind(globalThis);
        globalThis.fetch = async (input, options = {}) => {
          const url = new URL(
            input instanceof Request ? input.url : input,
            location.href,
          );
          const match = url.pathname.match(/^\/api\/tree\/(selection|search)$/);
          if (!match) return nativeFetch(input, options);

          const id = ++nextEndpointId;
          const response = new Promise((resolve) => {
            pendingEndpoints.set(id, resolve);
          });
          worker.postMessage({
            type: "endpoint",
            id,
            eventType: match[1],
            body: options.body ? JSON.parse(String(options.body)) : null,
          });
          return response;
        };

        worker.addEventListener("message", (event) => {
          if (event.data.type === "status")
            status.textContent = event.data.message;
          if (event.data.type === "error") fail(event.data.message);
          if (event.data.type === "wires") receiveWires(event.data.wires);
          if (event.data.type === "endpoint") {
            receiveWires(event.data.wires);
            const resolve = pendingEndpoints.get(event.data.id);
            if (resolve) {
              pendingEndpoints.delete(event.data.id);
              resolve(
                new Response(JSON.stringify(event.data.body), {
                  status: event.data.status,
                  headers: { "content-type": "application/json" },
                }),
              );
            }
          }
          if (event.data.type === "snapshot") {
            const { tree, style, wires } = event.data.payload;
            document.head.insertAdjacentHTML("beforeend", style);
            const store = new Store();
            const client = new transports.Client();
            const link = connectStore(
              store,
              client,
              (frame) => worker.postMessage({ type: "wire", frame }),
              transports,
            );
            receiveWires = (frames) => {
              for (const frame of frames) link.receive(frame);
            };
            receiveWires(wires);
            mount(document.querySelector("#example-root"), tree, store);
            window.setInterval(
              () => worker.postMessage({ type: "flush" }),
              100,
            );
            status.textContent = "Ready · Python model running in this browser";
            document.documentElement.dataset.ready = "true";
          }
        });
        worker.postMessage({ type: "start" });
      } catch (error) {
        fail(error);
      }
    </script>
  </body>
</html>
